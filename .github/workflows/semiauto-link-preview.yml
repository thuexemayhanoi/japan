name: Japan Semiautomatic Card QA Preview (one-time)
on:
  push:
    branches: [fix/japan-semi-auto-card-link-20261015]
permissions:
  contents: write
concurrency:
  group: japan-semiauto-preview
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scoped rebuild
        run: |
          set -euo pipefail
          node --check scripts/build.mjs
          node --check scripts/qa-internal-links.mjs
          node scripts/build.mjs
          node scripts/build.mjs --check
          node scripts/qa-factory.mjs
          node scripts/qa-nonpost.mjs
          node scripts/qa-internal-links.mjs
          node scripts/qa-nonpost.mjs --guard-scope
          node scripts/smoke-factory.mjs
          node scripts/seo-audit.mjs --mode=offline
      - name: Stage only safe generated pages and graph then remove preview
        run: |
          set -euo pipefail
          git config user.name "japan-link-qa"
          git config user.email "japan-link-qa@users.noreply.github.com"
          git add -u
          git rm -- .github/workflows/semiauto-link-preview.yml
          git diff --cached --name-only > /tmp/staged.txt
          if grep -E '^(content/articles/|_factory/|data/|CNAME$|sitemap.xml$)' /tmp/staged.txt; then echo "SAFE_STOP protected path"; exit 1; fi
          git commit -m "build(japan): correct semiautomatic cards in generated landing pages"
          git fetch --no-tags origin fix/japan-semi-auto-card-link-20261015
          if [ "$(git rev-parse origin/fix/japan-semi-auto-card-link-20261015)" != "$(git rev-parse HEAD^)" ]; then echo "SAFE_STOP branch moved"; exit 1; fi
          git push origin HEAD:fix/japan-semi-auto-card-link-20261015
