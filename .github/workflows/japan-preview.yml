name: Japan preview build (temporary)
on:
  push:
    branches: ['feat/japan-honda-red-200-foundation']
    paths: ['site/**','data/**','scripts/**','.github/workflows/japan-preview.yml']
permissions:
  contents: write
concurrency:
  group: japan-preview
  cancel-in-progress: false
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and check Japanese website
        run: |
          node --check scripts/build.mjs
          node --check scripts/taxonomy.mjs
          node --check scripts/factory.mjs
          node scripts/build.mjs
          node scripts/qa-factory.mjs
          node scripts/seo-audit.mjs --mode=offline
          node scripts/build.mjs --check
          node scripts/smoke-factory.mjs
      - name: Save generated HTML to preview branch
        run: |
          set -euo pipefail
          git config user.name "japan-preview-ci"
          git config user.email "japan-preview-ci@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No generated changes"; exit 0; fi
          git commit -m "build(japan): generate and QA Japanese static pages"
          git fetch origin feat/japan-honda-red-200-foundation
          if [ "$(git rev-parse origin/feat/japan-honda-red-200-foundation)" != "$(git rev-parse HEAD^)" ]; then echo "SAFE_STOP branch advanced"; exit 1; fi
          git push origin HEAD:feat/japan-honda-red-200-foundation
